[package]
name = "sparkmusic-protocol"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Request envelopes and the recovered route catalog shared by SparkMusic's Rust crates"

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
hex = "0.4.3"
md-5 = "0.10"
num-bigint = "0.4"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

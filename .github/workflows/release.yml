name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.1.1-beta)"
        required: true
        default: "0.1.1-beta"

permissions:
  contents: write

env:
  NFPM_VERSION: "2.49.0"

jobs:
  package:
    name: ${{ matrix.pkg }} · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: deb, arch: amd64, runner: ubuntu-24.04,     container: "debian:trixie", distro: debian }
          - { pkg: deb, arch: arm64, runner: ubuntu-24.04-arm, container: "debian:trixie", distro: debian }
          - { pkg: rpm, arch: amd64, runner: ubuntu-24.04,     container: "fedora:44",     distro: fedora }
          - { pkg: rpm, arch: arm64, runner: ubuntu-24.04-arm, container: "fedora:44",     distro: fedora }
    steps:
      - uses: actions/checkout@v4
      - name: dependencies (debian)
        if: matrix.distro == 'debian'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl ca-certificates pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev \
            qt6-declarative-dev-tools qt6-multimedia-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      - name: dependencies (fedora)
        if: matrix.distro == 'fedora'
        run: |
          dnf install -y gcc-c++ cmake ninja-build git curl tar \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel \
            mesa-libGL-devel
      - name: rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building $V for ${{ matrix.arch }}"
      - name: build and stage
        run: |
          cmake -S gui -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          DESTDIR="$PWD/staging" cmake --install build --strip
      - name: package
        env:
          VERSION: ${{ steps.v.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          case "$(uname -m)" in
            x86_64)  asset="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" ;;
            aarch64) asset="nfpm_${NFPM_VERSION}_Linux_arm64.tar.gz" ;;
            *) echo "unsupported host $(uname -m)"; exit 1 ;;
          esac
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${asset}" \
            | tar -xz -C /usr/local/bin nfpm
          mkdir -p dist
          nfpm package -f packaging/nfpm.yaml -p ${{ matrix.pkg }} -t dist/
          sha256sum dist/* > dist/SHA256SUMS
          ls -lh dist
      - name: install check (debian)
        if: matrix.distro == 'debian'
        run: |
          apt-get install -y ./dist/*.deb
          dpkg -s sparkmusic | head -6
          ldd /usr/bin/sparkmusic | grep sparkmusic_core
      - name: install check (fedora)
        if: matrix.distro == 'fedora'
        run: |
          dnf install -y ./dist/*.rpm
          rpm -qi sparkmusic | head -6
          ldd /usr/bin/sparkmusic | grep sparkmusic_core
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  publish:
    name: publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: list assets
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
